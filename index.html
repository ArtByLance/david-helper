<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2a1710" />
    <title>David's Things</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var requested = params.get("perf");
        var stored = "";
        try {
          stored = window.localStorage.getItem("davidsShelves.perfMode") || "";
          if (requested === "lite" || requested === "full") {
            stored = requested;
            window.localStorage.setItem("davidsShelves.perfMode", requested);
          }
        } catch (error) {
          stored = requested || "";
        }

        var memory = navigator.deviceMemory || 0;
        var userAgent = navigator.userAgent || "";
        var lowPowerDevice =
          (memory > 0 && memory <= 2) ||
          /Silk|KFTT|KF[A-Z0-9]+|K102|Android 4|Android 5/i.test(userAgent);
        var mode = stored || (lowPowerDevice ? "lite" : "full");

        window.KIOSK_PERF_MODE = mode;
        document.documentElement.dataset.perf = mode;
        if (mode === "lite") document.documentElement.classList.add("perf-lite");
      })();
    </script>

    <!--
      David's Things
      ===============

      Portrait tablet companion app.

      Local development:
        python3 -m http.server 8000
        http://localhost:8000

      Debug time:
        http://localhost:8000/?debugNow=2026-03-04T10:20:00
    -->

    <link rel="stylesheet" href="./css/layout.css?v=assets-20260602" />
    <link rel="stylesheet" href="./css/text.css?v=assets-20260602" />
    <link rel="stylesheet" href="./css/reader.css?v=assets-20260602" />
    <script>
      window.KIOSK = window.KIOSK || {};
      window.KIOSK.commsMode = "OFFSITE";
      window.KIOSK.vm = {
        proxyEndpoint: "/.netlify/functions/voice-monkey",
      };
    </script>
  </head>
  <body>
    <div id="app-shell">
      <div id="tv-stage" data-home="true" aria-label="David's Things tablet app">
        <main id="app-main" aria-live="polite"></main>

        <aside id="meal-timer" aria-label="Next meal">
          <div id="meal-message">Lunch is next.</div>
          <div id="meal-progress-group">
            <div id="meal-name">LUNCH</div>
            <div id="meal-target-label">12 pm</div>
            <div id="meal-bar-track">
              <div id="meal-bar-fill"></div>
              <div id="meal-now-marker" aria-hidden="true">
                <span>NOW</span>
                <i></i>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script type="module" src="./js/main.js?v=assets-20260602"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.warn("Service worker registration failed.", error);
          });
        });
      }
    </script>
  </body>
</html>
