<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David's Things</title>

    <!--
      David's Things
      ===============

      Portrait tablet companion app.

      Local development:
        python3 -m http.server 8000
        http://localhost:8000

      Debug time:
        http://localhost:8000/?debugNow=2026-03-04T10:20:00
    -->

    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/text.css" />
  </head>
  <body>
    <div id="app-shell">
      <div id="tv-stage" aria-label="David's Things tablet app">
        <main id="app-main" aria-live="polite"></main>

        <aside id="meal-timer" aria-label="Next meal">
          <div id="meal-name">LUNCH</div>
          <div id="meal-bar-track">
            <div id="meal-bar-fill"></div>
            <div id="meal-time-left">2 hours</div>
          </div>
          <div id="meal-message">Lunch is next.</div>
        </aside>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
