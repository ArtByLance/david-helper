<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David's Things</title>

    <!--
      David's Things
      ===============

      Portrait tablet companion app.

      Local development:
        python3 -m http.server 8000
        http://localhost:8000

      Debug time:
        http://localhost:8000/?debugNow=2026-03-04T10:20:00
    -->

    <link rel="stylesheet" href="./css/layout.css?v=assets-20260530" />
    <link rel="stylesheet" href="./css/text.css?v=assets-20260530" />
    <link rel="stylesheet" href="./css/reader.css?v=assets-20260530" />
    <script>
      window.KIOSK = window.KIOSK || {};
      window.KIOSK.commsMode = "OFFSITE";
      window.KIOSK.vm = {
        endpoint: "https://api-v2.voicemonkey.io/trigger",
        token: "TOKEN_NOT_SET",
      };
    </script>
  </head>
  <body>
    <div id="app-shell">
      <div id="tv-stage" data-home="true" aria-label="David's Things tablet app">
        <main id="app-main" aria-live="polite"></main>

        <aside id="meal-timer" aria-label="Next meal">
          <div id="meal-message">Lunch is next.</div>
          <div id="meal-progress-group">
            <div id="meal-name">LUNCH</div>
            <div id="meal-target-label">12 pm</div>
            <div id="meal-bar-track">
              <div id="meal-bar-fill"></div>
              <div id="meal-now-marker" aria-hidden="true">
                <span>NOW</span>
                <i></i>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script type="module" src="./js/main.js?v=assets-20260530"></script>
  </body>
</html>
