plugins {
  id 'com.android.application'
}

android {
  namespace 'com.davidscreen.firetv'
  compileSdk 34

  defaultConfig {
    applicationId "com.davidscreen.firetv"
    minSdk 25
    targetSdk 30
    versionCode 1
    versionName "0.1.0"
  }

  buildTypes {
    debug {
      debuggable true
    }

    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

configurations.configureEach {
  // This wrapper is plain Java, so we do not need the old split Kotlin JDK jars.
  // Excluding them keeps the AndroidX dependency tree from arguing with itself.
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.core:core:1.13.1'
}
